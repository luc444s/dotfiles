set -g default-terminal "screen-256color"
set -g extended-keys on
set -g allow-passthrough on
set -g status-interval 5
set -ga terminal-overrides ",xterm*:Tc"

set -g terminal-features ",screen-256color:RGB"
set -as terminal-features "screen-256color:extkeys"

set -g status-position top

set -g display-panes-colour #cba6f7
set -g display-panes-active-colour #f38ba8

setw -g clock-mode-colour #cba6f7

set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g mode-keys vi
set -g status-keys vi

# === Vim-style copy mode ===
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel # copy to tmux buffer only
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Copy to system clipboard — platform-aware:
#   Termux  -> termux-clipboard-set
#   Linux   -> xclip/wl-copy (fallback xsel)
if-shell 'command -v termux-clipboard-set >/dev/null' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set"' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard > /dev/null 2>&1 || wl-copy"'

# Paste tmux buffer (prefix + Shift+P)
bind P paste-buffer

# === Vim-style navigation ===
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === Catppuccin Theme ===
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_pane_border_style "fg=#1e1e2e"
set -g @catppuccin_pane_active_border_style "fg=#3c3c4c"

# === tmux-resurrect ===
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# === tmux-continuum (auto-save/restore) ===
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# === TPM (Tmux Plugin Manager) — must be LAST ===
run '~/.tmux/plugins/tpm/tpm'
